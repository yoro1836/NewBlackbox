apply plugin: 'com.android.library'

android {
    namespace 'org.blackbox.vector'
    compileSdk rootProject.ext.compileSdkVersion
    ndkVersion "29.0.13846066"

    defaultConfig {
        // LSPlant/Vector support Android 8.1+; BlackBox itself still runs on older releases and
        // simply leaves the Xposed engine dormant there.
        minSdkVersion rootProject.ext.minSdk
        ndk {
            abiFilters.addAll(rootProject.ext.abis)
        }
        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=c++_static", "-DANDROID_PLATFORM=android-27"
                cppFlags "-std=c++23"
            }
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.31.6'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
}

dependencies {
    compileOnly 'androidx.annotation:annotation:1.8.1'
}
