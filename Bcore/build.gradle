apply plugin: 'com.android.library'
def dobbyRevision = "5dfc8546954ce3b3198132ab13fddb89ee92cdd7"
def dobbyArchiveSha256 = "01a417233c40929aa21098c8a9724c00f6f05b5cde3f11abcac84b8e00053748"
def dobbyNdkVersion = "29.0.13846066"
def dobbyGeneratedDir = file("$buildDir/generated/dobby/$dobbyRevision")
def dobbyX86Archive = file("$dobbyGeneratedDir/x86_64/libdobby.a")

android {
    namespace 'top.niunaijun.blackbox'
    compileSdk rootProject.ext.compileSdkVersion
    ndkVersion dobbyNdkVersion


    aidlPackagedList "android/app/IServiceConnection.aidl"
    aidlPackagedList "android/accounts/IAccountManagerResponse.aidl"
    buildFeatures {
        aidl true
    }
    buildFeatures {
        prefab true
    }
    defaultConfig {
        minSdkVersion rootProject.ext.minSdk

        consumerProguardFiles "consumer-rules.pro"
        ndk {
            
            abiFilters 'arm64-v8a' , 'armeabi-v7a', 'x86_64'
        }
        externalNativeBuild {
            ndkBuild {
                arguments "DOBBY_X86_64_LIB=${dobbyX86Archive.absolutePath}"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    externalNativeBuild {
        ndkBuild {
            path 'src/main/cpp/Android.mk'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    
    
    tasks.withType(JavaCompile) {
        options.compilerArgs << "-Xlint:-deprecation" << "-Xlint:-unchecked" << "-Xlint:-rawtypes"
        options.fork = true
        options.forkOptions.jvmArgs << "-Xmx2048m"
    }
    testOptions {
        unitTests.returnDefaultValues = true
    }
    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }
    lintOptions {

        checkReleaseBuilds false
        abortOnError false
        warningsAsErrors false
        disable "UnusedResources", 'RestrictedApi'
        textOutput "stdout"
        textReport false
        checkOnly 'NewApi', 'InlinedApi'
    }
}


// Build the missing x86_64 Dobby archive from a pinned upstream source revision.
// ARM archives remain the checked-in prebuilts used by Android.mk.
def buildDobbyX86_64 = tasks.register("buildDobbyX86_64") {
    inputs.file(project.buildFile)
    inputs.property("dobbyRevision", dobbyRevision)
    inputs.property("dobbyArchiveSha256", dobbyArchiveSha256)
    outputs.file(dobbyX86Archive)

    doLast {
        def sourceRoot = file("$dobbyGeneratedDir/source")
        def sourceDir = file("$sourceRoot/Dobby-$dobbyRevision")
        def sourceArchive = file("$sourceRoot/dobby-${dobbyRevision}.tar.gz")
        def cmakeBuildDir = file("$dobbyGeneratedDir/cmake-x86_64")
        def sdkDir = android.sdkDirectory
        def ndkDir = file("$sdkDir/ndk/$dobbyNdkVersion")
        def cmake = file("$sdkDir/cmake/3.22.1/bin/cmake")

        if (!cmake.isFile()) {
            throw new GradleException("Dobby x86_64 build requires Android SDK CMake 3.22.1: ${cmake}")
        }
        if (!ndkDir.isDirectory()) {
            throw new GradleException("Dobby x86_64 build requires Android NDK ${dobbyNdkVersion}: ${ndkDir}")
        }

        sourceRoot.mkdirs()
        if (!sourceArchive.isFile()) {
            new URL("https://github.com/jmpews/dobby/archive/${dobbyRevision}.tar.gz").withInputStream { input ->
                sourceArchive.withOutputStream { output -> output << input }
            }
        }

        def digest = java.security.MessageDigest.getInstance("SHA-256")
        sourceArchive.withInputStream { input ->
            byte[] buffer = new byte[8192]
            int count
            while ((count = input.read(buffer)) != -1) {
                digest.update(buffer, 0, count)
            }
        }
        def actualSha256 = digest.digest().collect { String.format("%02x", it) }.join()
        if (actualSha256 != dobbyArchiveSha256) {
            throw new GradleException("Dobby source checksum mismatch: expected ${dobbyArchiveSha256}, got ${actualSha256}")
        }

        if (!sourceDir.isDirectory()) {
            project.copy {
                from project.tarTree(project.resources.gzip(sourceArchive))
                into sourceRoot
            }
        }

        // The pinned upstream CMake source list also names ARM64 assembly files
        // unconditionally. Remove only those non-target inputs for x86_64;
        // the archive itself remains checksum-verified before this edit.
        def sourceCmake = file("$sourceDir/CMakeLists.txt")
        def arm64AssemblyInputs = [
                "  source/TrampolineBridge/ClosureTrampolineBridge/arm64/closure_bridge_arm64.asm\n",
                "  source/TrampolineBridge/ClosureTrampolineBridge/arm64/closure_trampoline_arm64.asm\n"
        ]
        def sourceCmakeText = sourceCmake.getText("UTF-8")
        arm64AssemblyInputs.each { input ->
            sourceCmakeText = sourceCmakeText.replace(input, "")
        }
        sourceCmake.write(sourceCmakeText, "UTF-8")

        def x64AssemblyInputs = [
                "source/TrampolineBridge/ClosureTrampolineBridge/x64/closure_bridge_x64.asm",
                "source/TrampolineBridge/ClosureTrampolineBridge/x64/closure_trampoline_x64.asm"
        ]
        x64AssemblyInputs.each { input ->
            def asmFile = file("$sourceDir/$input")
            def preprocessedInput = input.replace(".asm", ".S")
            def preprocessedFile = file("$sourceDir/$preprocessedInput")
            if (asmFile.isFile() && !preprocessedFile.exists() && !asmFile.renameTo(preprocessedFile)) {
                throw new GradleException("Unable to prepare Dobby x86_64 assembly input: ${asmFile}")
            }
            sourceCmakeText = sourceCmakeText.replace(input, preprocessedInput)
        }
        sourceCmake.write(sourceCmakeText, "UTF-8")

        // Keep the pinned Android sources buildable with the NDK headers:
        // qualify global memory primitives and match RuntimeModule's field
        // name used by the Linux backend in this upstream revision.
        def archFeatures = file("$sourceDir/common/os_arch_features.h")
        def archFeaturesText = archFeatures.getText("UTF-8")
                .replace("#include \"PlatformUnifiedInterface/platform.h\"",
                        "#include \"../source/PlatformUnifiedInterface/platform.h\"\n"
                                + "#include <unistd.h>\n"
                                + "#include <sys/mman.h>")
        archFeaturesText = archFeaturesText
                .replace("::::OSMemory", "OSMemory")
                .replace("::::kReadExecute", "kReadExecute")
                .replace("  auto page = (void *)ALIGN_FLOOR(address, OSMemory::PageSize());",
                        "  auto page_size = sysconf(_SC_PAGESIZE);\n"
                                + "  auto page = (void *)ALIGN_FLOOR(address, page_size);")
                .replace("  if (!OSMemory::SetPermission(page, OSMemory::PageSize(), kReadExecute)) {",
                        "  if (mprotect(page, page_size, PROT_READ | PROT_EXEC) != 0) {")
        archFeatures.write(archFeaturesText, "UTF-8")
        def processRuntime = file("$sourceDir/source/Backend/UserMode/PlatformUtil/Linux/ProcessRuntime.cc")
        def codePatch = file("$sourceDir/source/Backend/UserMode/ExecMemory/code-patch-tool-posix.cc")
        def codePatchText = codePatch.getText("UTF-8").replace("#include \"core/arch/Cpu.h\"\n", "")
        codePatch.write(codePatchText, "UTF-8")
        def processRuntimeText = processRuntime.getText("UTF-8").replace("a.start < b.start", "a.start_ < b.start_")
        processRuntime.write(processRuntimeText, "UTF-8")
        def runtimeModule = file("$sourceDir/source/PlatformUtil/ProcessRuntime.h")
        def runtimeModuleText = runtimeModule.getText("UTF-8").replace("  void *base;", "  void *load_address;")
        runtimeModule.write(runtimeModuleText, "UTF-8")

        // CMake caches the Android ABI in the toolchain configuration; always
        // start this generated tree clean so a prior failed configure cannot
        // silently reuse an ARM compiler target.
        project.delete(cmakeBuildDir)

        project.exec {
            commandLine cmake.absolutePath,
                    "-S", sourceDir.absolutePath,
                    "-B", cmakeBuildDir.absolutePath,
                    "-DCMAKE_BUILD_TYPE=Release",
                    "-DCMAKE_TOOLCHAIN_FILE=${ndkDir}/build/cmake/android.toolchain.cmake",
                    "-DANDROID_ABI=x86_64",
                    "-DCMAKE_ANDROID_ARCH_ABI=x86_64",
                    "-DANDROID_TOOLCHAIN_NAME=x86_64-clang",
                    "-DCMAKE_SYSTEM_NAME=Android",
                    "-DCMAKE_SYSTEM_PROCESSOR=x86_64",
                    "-DANDROID_PLATFORM=android-24",
                    "-DCMAKE_SYSTEM_VERSION=24",
                    "-DCMAKE_C_FLAGS=-DANDROID",
                    "-DCMAKE_CXX_FLAGS=-DANDROID",
                    "-DDOBBY_GENERATE_SHARED=OFF",
                    "-DDOBBY_BUILD_EXAMPLE=OFF",
                    "-DDOBBY_BUILD_TEST=OFF"
        }
        project.exec {
            commandLine cmake.absolutePath, "--build", cmakeBuildDir.absolutePath,
                    "--target", "dobby_static", "--config", "Release", "--parallel", "2"
        }

        def builtArchive = file("$cmakeBuildDir/libdobby.a")
        if (!builtArchive.isFile()) {
            throw new GradleException("Dobby build completed without ${builtArchive}")
        }
        dobbyX86Archive.parentFile.mkdirs()
        project.copy {
            from builtArchive
            into dobbyX86Archive.parentFile
            rename { dobbyX86Archive.name }
        }
    }
}

// AGP creates the externalNativeBuild tasks after this script is evaluated.
// Attach the source build lazily so every native variant has the x86_64 archive.
tasks.configureEach { task ->
    // ndkBuild variants are named configureNdkBuild<Variant>[abi] / buildNdkBuild<Variant>[abi]
    // (not "externalNativeBuild*"), and the x86_64 configure step already needs the archive.
    def name = task.name.toLowerCase(Locale.ROOT)
    if ((name.contains("externalnativebuild") || name.startsWith("configurendkbuild") ||
            name.startsWith("buildndkbuild")) && !name.contains("clean")) {
        task.dependsOn(buildDobbyX86_64)
    }
}



// Strip the AIDL-generated "Using: ..." comment line which contains backslash sequences
// that Java's compiler mis-parses as Unicode escapes on Windows paths.
tasks.matching { it.name.startsWith('compileReleaseJavaWithJavac') || it.name.startsWith('compileDebugJavaWithJavac') }.all {
    doFirst {
        def aidlOut = file("$buildDir/generated/aidl_source_output_dir")
        if (aidlOut.exists()) {
            aidlOut.eachFileRecurse { f ->
                if (f.name.endsWith('.java')) {
                    def content = f.text
                    if (content.contains(' * Using:')) {
                        content = content.replaceAll(/(?m)^ \* Using:.*$/, '')
                        f.text = content
                    }
                }
            }
        }
    }
}

tasks.withType(Javadoc) {
    options.addStringOption('Xdoclint:none', '-quiet')
    options.addStringOption('encoding', 'UTF-8')
    options.addStringOption('charSet', 'UTF-8')
}


dependencies {
    implementation fileTree(dir: "libs", include: ["*.jar", "*.aar"])
  implementation 'com.google.android.material:material:1.3.0'
    implementation(project(":black-reflection"))
    annotationProcessor(project(":compiler"))
    implementation 'androidx.appcompat:appcompat:1.2.0'

    implementation 'com.moandjiezana.toml:toml4j:0.7.2'

    implementation 'com.github.tiann:FreeReflection:3.2.2'

    // Xposed framework support (Pine inline-hook engine + Xposed API).
    // The engine ships arm64/armeabi-v7a native code only; on other ABIs
    // Xposed stays dormant (graceful, no crash).
    // Xposed engine (LSPlant, GPL-3.0): kept in its own module so its licence boundary is explicit.
    api project(':vector')

    
}
