name: Build and Send APK to Telegram

on:
  push:
    branches:
      - main
  workflow_dispatch:

# A newer push makes the older run pointless; cancel it instead of queueing a second long build.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-send:
    runs-on: ubuntu-latest
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The default ("tools platform-tools") fails: the legacy "tools" package no longer
          # exists in the SDK repository. Only platform-tools here; the build's pinned platform,
          # build-tools, NDK and CMake are installed (and cached) in the steps below.
          packages: platform-tools

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || yes | $ANDROID_HOME/tools/bin/sdkmanager --licenses || true

      - name: Cache SDK components (NDK, CMake)
        id: sdk_cache
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/lib/android/sdk/ndk/29.0.13846066
            /usr/local/lib/android/sdk/cmake/3.22.1
            /usr/local/lib/android/sdk/cmake/3.31.6
            /usr/local/lib/android/sdk/platforms/android-35
            /usr/local/lib/android/sdk/build-tools/35.0.0
          # Bump the suffix when the pinned versions below change.
          key: android-sdk-p35-bt35.0.0-ndk29.0.13846066-cmake3.22.1-3.31.6-v2

      - name: Install SDK platform, build-tools, CMake and NDK
        # Bcore builds Dobby for x86_64 with CMake 3.22.1, :vector needs CMake 3.31.6, and the
        # native modules pin NDK 29. The runner image does not ship these exact versions.
        # Restored from the cache above when possible, so this normally downloads nothing.
        if: steps.sdk_cache.outputs.cache-hit != 'true'
        run: $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1" "cmake;3.31.6" "ndk;29.0.13846066"

      - name: Cache native build outputs
        uses: actions/cache@v4
        with:
          path: |
            Bcore/.cxx
            Bcore/build/generated/dobby
            vector/.cxx
          # The Dobby x86_64 archive and the ndkBuild/CMake object files only change with the
          # native sources or the native build configuration.
          key: native-${{ runner.os }}-${{ hashFiles('Bcore/src/main/cpp/**', 'vector/src/main/cpp/**', 'Bcore/build.gradle', 'vector/build.gradle') }}
          restore-keys: |
            native-${{ runner.os }}-

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build APKs and AARs
        # -Pabis=arm64-v8a builds the native code and APK for that ABI only (about a third of the
        # work, and no x86_64 Dobby build). --build-cache reuses compile/dex/resource task
        # outputs from earlier runs; the Gradle home itself is cached by setup-java above.
        run: ./gradlew --build-cache -Pabis=arm64-v8a assembleDebug assembleRelease :Bcore:assembleDebug :Bcore:assembleRelease :black-reflection:assemble :compiler:assemble

      - name: Find Bcore AAR paths
        id: aar_paths
        run: |
          DEBUG_AAR=$(find ./Bcore/build/outputs/aar -name "*debug.aar" | head -n 1)
          RELEASE_AAR=$(find ./Bcore/build/outputs/aar -name "*release.aar" | head -n 1)
          echo "debug_aar_path=$DEBUG_AAR" >> $GITHUB_OUTPUT
          echo "release_aar_path=$RELEASE_AAR" >> $GITHUB_OUTPUT

      - name: Find black-reflection and compiler artifact paths
        id: additional_artifacts
        run: |
          BLACK_REFLECTION_ART=$(find ./black-reflection/build/libs ./black-reflection/build/outputs -name "*.jar" -o -name "*.aar" 2>/dev/null | head -n 1)
          COMPILER_ART=$(find ./compiler/build/libs ./compiler/build/outputs -name "*.jar" -o -name "*.aar" 2>/dev/null | head -n 1)
          echo "black_reflection_path=$BLACK_REFLECTION_ART" >> $GITHUB_OUTPUT
          echo "compiler_path=$COMPILER_ART" >> $GITHUB_OUTPUT

      # Every upload needs its own artifact name; without one they all use "artifact" and the
      # second upload fails with "409 Conflict: an artifact with this name already exists".
      - name: Upload ALL Debug APKs
        uses: actions/upload-artifact@v7.0.2
        with:
          name: debug-apks
          path: ./app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload ALL Release APKs
        uses: actions/upload-artifact@v7.0.2
        with:
          name: release-apks
          path: ./app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload Bcore AARs
        uses: actions/upload-artifact@v7.0.2
        with:
          name: bcore-aars
          path: ./Bcore/build/outputs/aar/*.aar
          if-no-files-found: warn
