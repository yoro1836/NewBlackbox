name: Build and Send APK to Telegram

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-send:
    runs-on: ubuntu-latest
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The action's default also asks sdkmanager for the removed "tools" package, which
          # fails with "Failed to find package 'tools'".
          packages: platform-tools

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || yes | $ANDROID_HOME/tools/bin/sdkmanager --licenses || true

      - name: Install CMake and NDK
        # Bcore builds Dobby for x86_64 with CMake 3.22.1, :vector needs CMake 3.31.6, and both
        # modules pin NDK 29. The runner image does not ship these exact versions.
        run: $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "cmake;3.22.1" "cmake;3.31.6" "ndk;29.0.13846066"

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build APKs and AARs
        run: ./gradlew assembleDebug assembleRelease :Bcore:assembleDebug :Bcore:assembleRelease :black-reflection:assemble :compiler:assemble

      - name: Find Bcore AAR paths
        id: aar_paths
        run: |
          DEBUG_AAR=$(find ./Bcore/build/outputs/aar -name "*debug.aar" | head -n 1)
          RELEASE_AAR=$(find ./Bcore/build/outputs/aar -name "*release.aar" | head -n 1)
          echo "debug_aar_path=$DEBUG_AAR" >> $GITHUB_OUTPUT
          echo "release_aar_path=$RELEASE_AAR" >> $GITHUB_OUTPUT

      - name: Find black-reflection and compiler artifact paths
        id: additional_artifacts
        run: |
          BLACK_REFLECTION_ART=$(find ./black-reflection/build/libs ./black-reflection/build/outputs -name "*.jar" -o -name "*.aar" 2>/dev/null | head -n 1)
          COMPILER_ART=$(find ./compiler/build/libs ./compiler/build/outputs -name "*.jar" -o -name "*.aar" 2>/dev/null | head -n 1)
          echo "black_reflection_path=$BLACK_REFLECTION_ART" >> $GITHUB_OUTPUT
          echo "compiler_path=$COMPILER_ART" >> $GITHUB_OUTPUT

      # Every upload needs its own artifact name; without one they all use "artifact" and the
      # second upload fails with "409 Conflict: an artifact with this name already exists".
      - name: Upload ALL Debug APKs
        uses: actions/upload-artifact@v7.0.2
        with:
          name: blackbox-debug-apks
          path: ./app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload ALL Release APKs
        uses: actions/upload-artifact@v7.0.2
        with:
          name: blackbox-release-apks
          path: ./app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload Bcore AARs
        uses: actions/upload-artifact@v7.0.2
        with:
          name: bcore-aars
          path: ./Bcore/build/outputs/aar/*.aar
          if-no-files-found: warn
