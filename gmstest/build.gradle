plugins {
    alias(libs.plugins.android.application)
}

// Small app for checking Google sign-in and Play Games sign-in inside the virtual space.
android {
    namespace 'top.niunaijun.gmstest'
    compileSdk rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "top.niunaijun.gmstest"
        minSdk 23
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }
    signingConfigs {
        // Same checked-in debug key as :app, so rebuilds install over each other.
        debug {
            storeFile rootProject.file("app/debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.android.gms:play-services-auth:21.3.0'
    implementation 'com.google.android.gms:play-services-games-v2:21.0.0'
}
